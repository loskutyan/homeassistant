tg_weather:
  template:
    - sensor:
        - name: "Шестой час почасового прозноза погоды"
          unique_id: yandex_weather_hourly_forecast_6th_hour
          default_entity_id: sensor.yandex_weather_hourly_forecast_6th_hour
          availability: >-
            {% set hourly = state_attr('weather.yandex_weather', 'forecastHourly') %}
            {% set forecast = hourly[6]
               if hourly is sequence and hourly is not string and hourly is not mapping and hourly | count > 6
               else none %}
            {% set dt = forecast.get('datetime') if forecast is mapping else none %}
            {{ dt is string and dt | float(none) is none and as_datetime(dt, none) is not none }}
          state: >
            {% set dt = state_attr('weather.yandex_weather', 'forecastHourly')[6]['datetime'] %}
            {{ as_datetime(dt).hour }}

        - name: "Двенадцатый час почасового прозноза погоды"
          unique_id: yandex_weather_hourly_forecast_12th_hour
          default_entity_id: sensor.yandex_weather_hourly_forecast_12th_hour
          availability: >-
            {% set hourly = state_attr('weather.yandex_weather', 'forecastHourly') %}
            {% set forecast = hourly[12]
               if hourly is sequence and hourly is not string and hourly is not mapping and hourly | count > 12
               else none %}
            {% set dt = forecast.get('datetime') if forecast is mapping else none %}
            {{ dt is string and dt | float(none) is none and as_datetime(dt, none) is not none }}
          state: >
            {% set dt = state_attr('weather.yandex_weather', 'forecastHourly')[12]['datetime'] %}
            {{ as_datetime(dt).hour }}

  script:
    sending_yandex_weather_forecast:
      alias: "Отправка прогноза погоды"
      variables:
        friendly_conditions:
          "rainy": "Дождь"
          "pouring": "Ливень"
          "hail": "Град"
          "lightning": "Молния"
          "lightning-rainy": "Молния, дождь"
          "snowy": "Снег"
          "snowy-rainy": "Снег с дождем"
          "sunny": "Ясно"
          "clear-night": "Ясно"
          "cloudy": "Облачно"
          "partlycloudy": "Переменная облачность"
          "fog": "Туман"
          "windy": "Ветрено"
          "windy-variant": "Ветрено"
          "exceptional": "Предупреждение"
        conditions_emojis:
          "rainy": "🌧"
          "pouring": "🌧🌧"
          "hail": "🌧☔"
          "lightning": "🌩"
          "lightning-rainy": "⛈"
          "snowy": "🌨"
          "snowy-rainy": "🌧❄"
          "sunny": "☀"
          "clear-night": "🌌"
          "cloudy": "☁"
          "partlycloudy": "⛅"
          "fog": "🌫"
          "windy": "💨"
          "windy-variant": "🌬"
          "exceptional": "❗"
        friendly_wind_bearings:
          "0": "Северный"
          "45": "Северо-восточный"
          "90": "Восточный"
          "135": "Юго-восточный"
          "180": "Южный"
          "225": "Юго-западный"
          "270": "Западный"
          "315": "Северо-западный"
          "360": "Северный"
      sequence:
        - action: notify.send_message
          target:
            entity_id: notify.tg_bot
          data:
            message: |-
              {% set w_dt = states('sensor.yandex_weather_data_update_time') %}
              {% set w_time = as_datetime(w_dt, none) if w_dt | float(none) is none else none %}
              {% set condition = states('weather.yandex_weather') %}
              {% set wind_speed = (state_attr('weather.yandex_weather', 'wind_speed') | float(0) / 3.6) | round(1) %}
              {% set wind_bearing = state_attr('weather.yandex_weather', 'wind_bearing') %}
              {% set friendly_condition = friendly_conditions.get(condition, 'Неизвестная погода') %}
              {% set condition_emoji = conditions_emojis.get(condition, '❌') %}
              {% set friendly_wind_bearing = friendly_wind_bearings.get(wind_bearing | string, 'Неизвестный ветер').lower() %}
              {% set temp_unit = state_attr('weather.yandex_weather', 'temperature_unit') %}
              {% set messages = [
                'Итак.',
                'Здравствуйте!',
                'Итак, поехали!',
              ] %}
              {% set now_hour = now().hour %}
              {% if 6 <= now_hour < 12 %}
                {% set messages = messages + ['Доброе утро!', 'Утро доброе!'] %}
              {% elif 12 <= now_hour < 18 %}
                {% set messages = messages + ['Добрый день!'] %}
              {% elif 18 <= now_hour %}
                {% set messages = messages + ['Добрый вечер!', 'Вечер в хату!'] %}
              {% endif %}
              {{ messages | random }}
              {{ condition_emoji }} {% if w_time is not none %}По состоянию на {{ w_time.astimezone().strftime('%H:%M') }}{% else %}Время обновления неизвестно,{% endif %} на улице {{ friendly_condition.lower() }}.
              Температура {{ state_attr('weather.yandex_weather', 'temperature') }}{{ temp_unit }},
              ощущается как {{ state_attr('weather.yandex_weather', 'feels_like') }}{{ temp_unit }}.
              Ветер {{ friendly_wind_bearing }}, со скоростью {{ wind_speed }} м/с.
        - delay:
            seconds: 15
        - action: notify.send_message
          target:
            entity_id: notify.tg_bot
          data:
            message: |-
              {% set hourly = state_attr('weather.yandex_weather', 'forecastHourly') -%}
              {% set forecast = hourly[6]
                 if hourly is sequence and hourly is not string and hourly is not mapping and hourly | count > 6
                 else none -%}
              {% set forecast_dt = forecast.get('datetime') if forecast is mapping else none -%}
              {% set forecast_time = as_datetime(forecast_dt, none)
                 if forecast_dt is string and forecast_dt | float(none) is none else none -%}
              {% set numbers = [forecast.get('native_temperature'), forecast.get('native_apparent_temperature'),
                                forecast.get('wind_bearing'), forecast.get('native_wind_speed'),
                                forecast.get('native_wind_gust_speed')] if forecast is mapping else [] -%}
              {% if forecast is mapping and forecast_time is not none and forecast.get('condition') is string
                    and numbers | select('number') | reject('boolean') | select('is_number') | list | count == 5 -%}
              {% set temp = forecast['native_temperature'] %}
              {% set temp_feels_like = forecast['native_apparent_temperature'] %}
              {% set condition = forecast['condition'] %}
              {% set wind_bearing_raw = forecast['wind_bearing'] %}
              {% set wind_bearing = (wind_bearing_raw / 45) | round(0) * 45 %}
              {% set wind_speed = forecast['native_wind_speed'] | round(1) %}
              {% set wind_gust_speed = forecast['native_wind_gust_speed'] | round(1) %}
              {% set friendly_condition = friendly_conditions.get(condition, 'Неизвестная погода') %}
              {% set condition_emoji = conditions_emojis.get(condition, '❌') %}
              {% set friendly_wind_bearing = friendly_wind_bearings.get(wind_bearing | string, 'Неизвестный ветер').lower() %}
              {% set temp_unit = state_attr('weather.yandex_weather', 'temperature_unit') %}
              {% set messages = [
                'Теперь к прогнозам.',
                'Далее.',
              ] %}
              {% set fc_hour = forecast_time.hour %}
              {% if 0 <= fc_hour < 6 %}
                {% set day_part = ['Ночью'] %}
              {% elif 6 <= fc_hour < 12 %}
                {% set day_part = ['Утром'] %}
              {% elif 12 <= fc_hour < 18 %}
                {% set day_part = ['Днем', 'В середине дня'] %}
              {% elif 18 <= fc_hour %}
                {% set day_part = ['Вечером', 'К вечеру', 'Ближе к вечеру'] %}
              {% else %}
                {% set day_part = ['Непонятно когда'] %}
              {% endif %}
              {{ messages | random }}
              {{ condition_emoji }} {{ day_part | random }} (к {{fc_hour}}:00) на улице будет {{ friendly_condition.lower() }}.              
              Температура ожидается около {{ temp }}{{ temp_unit }},
              будет ощущаться как {{ temp_feels_like }}{{ temp_unit }}.
              Ветер {{ friendly_wind_bearing }}, скорость {{ wind_speed }} м/с (с порывами до {{ wind_gust_speed }} м/с).
              {%- else %}
              ⚠ Прогноз на шестой час недоступен: данные ещё не получены или неполны.
              {%- endif %}

        - delay:
            seconds: 15
        - action: notify.send_message
          target:
            entity_id: notify.tg_bot
          data:
            message: |-
              {% set hourly = state_attr('weather.yandex_weather', 'forecastHourly') -%}
              {% set forecast = hourly[12]
                 if hourly is sequence and hourly is not string and hourly is not mapping and hourly | count > 12
                 else none -%}
              {% set forecast_dt = forecast.get('datetime') if forecast is mapping else none -%}
              {% set forecast_time = as_datetime(forecast_dt, none)
                 if forecast_dt is string and forecast_dt | float(none) is none else none -%}
              {% set numbers = [forecast.get('native_temperature'), forecast.get('native_apparent_temperature'),
                                forecast.get('wind_bearing'), forecast.get('native_wind_speed'),
                                forecast.get('native_wind_gust_speed')] if forecast is mapping else [] -%}
              {% if forecast is mapping and forecast_time is not none and forecast.get('condition') is string
                    and numbers | select('number') | reject('boolean') | select('is_number') | list | count == 5 -%}
              {% set temp = forecast['native_temperature'] %}
              {% set temp_feels_like = forecast['native_apparent_temperature'] %}
              {% set condition = forecast['condition'] %}
              {% set wind_bearing_raw = forecast['wind_bearing'] %}
              {% set wind_bearing = (wind_bearing_raw / 45) | round(0) * 45 %}
              {% set wind_speed = forecast['native_wind_speed'] | round(1) %}
              {% set wind_gust_speed = forecast['native_wind_gust_speed'] | round(1) %}
              {% set friendly_condition = friendly_conditions.get(condition, 'Неизвестная погода') %}
              {% set condition_emoji = conditions_emojis.get(condition, '❌') %}
              {% set friendly_wind_bearing = friendly_wind_bearings.get(wind_bearing | string, 'Неизвестный ветер').lower() %}
              {% set temp_unit = state_attr('weather.yandex_weather', 'temperature_unit') %}
              {% set messages = [
                'Теперь к прогнозам.',
                'Далее.',
              ] %}
              {% set fc_hour = forecast_time.hour %}
              {% if 0 <= fc_hour < 6 %}
                {% set day_part = ['Ночью'] %}
              {% elif 6 <= fc_hour < 12 %}
                {% set day_part = ['Утром'] %}
              {% elif 12 <= fc_hour < 18 %}
                {% set day_part = ['Днем', 'В середине дня'] %}
              {% elif 18 <= fc_hour %}
                {% set day_part = ['Вечером', 'К вечеру', 'Ближе к вечеру'] %}
              {% else %}
                {% set day_part = ['Непонятно когда'] %}
              {% endif %}
              {{ messages | random }}
              {{ condition_emoji }} {{ day_part | random }} (к {{fc_hour}}:00) на улице будет {{ friendly_condition.lower() }}.         
              Температура будет примерно {{ temp }}{{ temp_unit }},
              по ощущениям около {{ temp_feels_like }}{{ temp_unit }}.
              Ветер {{ friendly_wind_bearing }}, скорость {{ wind_speed }} м/с (с порывами до {{ wind_gust_speed }} м/с).
              {%- else %}
              ⚠ Прогноз на двенадцатый час недоступен: данные ещё не получены или неполны.
              {%- endif %}

  automation:
    - id: "Прогноз погоды на день"
      alias: telegram_morning_weather_forecast
      initial_state: true
      triggers:
        - trigger: time
          at: "08:00:00"
      actions:
        - action: script.sending_yandex_weather_forecast
