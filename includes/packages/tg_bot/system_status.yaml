tg_system_status:
  script:
    telegram_system_report:
      alias: 'Отправка отчета о состоянии системы'
      sequence:
        - action: notify.send_message
          target:
            entity_id: notify.tg_bot
          data:
            message: |-
              🛀 Состояние системы
              🕧 Отчет за {{ states('sensor.time_date') }}
              💡 Светильников недоступно - {{ states('sensor.lights_unavailable_count') }} 
              🔌 Свичей недоступно - {{ states('sensor.switches_unavailable_count') }} 
              🌡 Сенсоров недоступно - {{ states('sensor.sensors_unavailable_count') }} 
              🔟 Бинарных сенсоров недоступно - {{ states('sensor.binary_sensors_unavailable_count') }}


  automation: 
    - id: 'Отчет при запуске системы в боте'
      alias: home_assistant_started_notify
      initial_state: true
      triggers:
        - trigger: homeassistant
          event: start
      actions:
        - action: notify.send_message
          target:
            entity_id: notify.tg_bot
          data:
            message: |-
              💬 Основной сервер MiniPC
              🕧 Зафиксирован запуск в {{ states('sensor.time_date') }}
        - delay:
            minutes: 1
            seconds: 10
        - action: script.telegram_system_report

    - id: 'Отчет о состоянии системы в боте'
      alias: home_assistant_report_notify
      initial_state: true
      triggers:
        - trigger: event
          event_type: telegram_text
          event_data:
            text: 'Отчет по системе'
      actions:
        - action: script.telegram_system_report
