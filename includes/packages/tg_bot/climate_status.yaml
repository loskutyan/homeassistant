tg_climate_status:
  script:
    telegram_climate_report:
      alias: "Отправка отчета о состоянии воздуха"
      sequence:
        - action: notify.send_message
          target:
            entity_id: notify.tg_bot
          data:
            message: |-
              {%- macro reading(entity_id, unit='', decimals=none) -%}
                {%- set value = states(entity_id) -%}
                {%- if not is_number(value) -%}
                  нет данных
                {%- elif decimals == 0 -%}
                  {{ value | int }}{{ unit }}
                {%- elif decimals is not none -%}
                  {{ value | round(decimals) }}{{ unit }}
                {%- else -%}
                  {{ value }}{{ unit }}
                {%- endif -%}
              {%- endmacro -%}
              {%- macro humidifier_status(room) -%}
                {%- set hum = states('humidifier.' ~ room ~ '_smartmi_humidifier') -%}
                {%- if hum == 'off' -%}
                  выключен
                {%- elif hum == 'on' -%}
                  {%- set tank = states('sensor.' ~ room ~ '_smartmi_humidifier_water_tank') -%}
                  {%- if tank == 'off' -%}
                    контейнер снят
                  {%- else -%}
                    {{ reading('sensor.' ~ room ~ '_smartmi_humidifier_motor_speed', ' об/мин') }}, ур. воды {{ reading('sensor.' ~ room ~ '_smartmi_humidifier_water_level', '%') }}
                  {%- endif -%}
                {%- else -%}
                  недоступен
                {%- endif -%}
              {%- endmacro -%}
              {%- macro breezer_status(room) -%}
                {%- set breezer = states('fan.mijia_airpurifier_' ~ room) -%}
                {%- if breezer == 'off' -%}
                  выключен
                {%- elif breezer == 'on' -%}
                  {%- set mode = states('sensor.' ~ room ~ '_airpurifier_preset_mode') -%}
                  {%- if mode == 'Sleep' -%}
                    {%- set mode_msg = 'ночной' -%}
                  {%- elif mode == 'Auto' -%}
                    {%- set mode_msg = 'автоматический' -%}
                  {%- elif mode == 'Favorite' -%}
                    {%- if is_state('switch.' ~ room ~ '_airpurifier_favourite_speed_smart_control', 'on') -%}
                      {%- set mode_msg = 'умный' -%}
                    {%- elif is_state('switch.' ~ room ~ '_airpurifier_forced_ventilation', 'on') -%}
                      {%- set mode_msg = 'проветривания' -%}
                    {%- else -%}
                      {%- set mode_msg = 'фиксированный' -%}
                    {%- endif -%}
                  {%- else -%}
                    {%- set mode_msg = 'нет данных' -%}
                  {%- endif -%}
                  {%- set heater_msg = '' -%}
                  {%- if is_state('binary_sensor.' ~ room ~ '_airpurifier_ptc_status', 'on') -%}
                    {%- set heater_msg = ', 🔥 подогрев включен' -%}
                  {%- endif -%}
                  режим {{ mode_msg }}, скорость {{ reading('sensor.' ~ room ~ '_airpurifier_current_speed') }}{{ heater_msg }}
                {%- else -%}
                  недоступен
                {%- endif -%}
              {%- endmacro -%}
              🛌 Спальня:
              🌡 {{ reading('sensor.bedroom_average_temperature', '°C', 1) }}  💧 {{ reading('sensor.bedroom_average_humidity', '%', 1) }}
              🌲 {{ reading('sensor.bedroom_co2', ' ppm', 0) }}  ⚛ {{ reading('sensor.bedroom_pm25', ' µg/m³') }}
              🚿 Увлажнитель: {{ humidifier_status('bedroom') }}
              💨 Бризер: {{ breezer_status('bedroom') }}

              🧒 Детская:
              🌡 {{ reading('sensor.kidsroom_average_temperature', '°C', 1) }}  💧 {{ reading('sensor.kidsroom_average_humidity', '%', 1) }}
              🌲 {{ reading('sensor.kidsroom_co2', ' ppm', 0) }}  ⚛ {{ reading('sensor.kidsroom_pm25', ' µg/m³') }}
              🚿 Увлажнитель: {{ humidifier_status('kidsroom') }}
              💨 Бризер: {{ breezer_status('kidsroom') }}

  automation:
    - id: "Отчет о состоянии воздуха в боте"
      alias: telegram_climate_report
      triggers:
        - trigger: event
          event_type: telegram_text
          event_data:
            text: "Отчет по климату"
      actions:
        - action: script.telegram_climate_report
