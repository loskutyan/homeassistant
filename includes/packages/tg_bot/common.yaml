tg_common:
  automation:
    - id: 'Клавиатура бота'
      alias: telegram_keyboard
      initial_state: true
      triggers:
        - trigger: event
          event_type: telegram_command
          event_data:
            command: '/start'
      actions:
        - action: notify.send_message
          target:
            entity_id: notify.tg_bot
          data:
            message: |
              {% set messages = [
                'Привет!',
                'Доброго времени суток!',
                'Милорд.',
                'Приступим!'
              ] %}
              {{ messages | random }}

              Доступные команды:
            data:
              keyboard:
                - 'Отчет по системе, Отчет по климату'
                - 'Прогноз погоды, Управление'

    - id: 'Панель управления бота'
      alias: telegram_control_panel
      initial_state: true
      triggers:
        - trigger: event
          event_type: telegram_text
          event_data:
            text: 'Управление'
      actions:
        - action: notify.send_message
          target:
            entity_id: notify.tg_bot
          data:
            message: |
              {% set messages = ['Панель управления', 'Контрольная панель'] %}
              {{ messages | random }}
            data:
              inline_keyboard:
                - 'Свет:/lights, Отопление:/heaters'
                - 'Вода:/valves'
                - 'Статус:/status'

    - id: 'Управление кранами в боте'
      alias: telegram_valves_control
      initial_state: true
      triggers:
        - trigger: event
          event_type: telegram_callback
          event_data:
            data: '/valves'
      actions:
        - action: telegram_bot.answer_callback_query
          data:
            callback_query_id: '{{ trigger.event.data.id }}'
            message: 'Что нужно сделать с кранами?'
        - action: notify.send_message
          target:
            entity_id: notify.tg_bot
          data:
            message: 'Управляем кранами..'
            data:
              inline_keyboard:
                - 'Перекрыть краны:/close_valves'

    - id: 'Перекрытие кранов через бот'
      alias: telegram_valves_close
      initial_state: true
      triggers:
        trigger: event
        event_type: telegram_callback
        event_data:
          data: '/close_valves'
      actions:
        - action: telegram_bot.answer_callback_query
          data:
            callback_query_id: '{{ trigger.event.data.id }}'
            message: 'Перекрываем краны'
        - action: script.close_bathroom_valves

    - id: 'Прогноз погоды в боте'
      alias: telegram_weather_forecast
      initial_state: true
      triggers:
        - trigger: event
          event_type: telegram_text
          event_data:
            text: 'Прогноз погоды'
      actions:
        - action: script.sending_yandex_weather_forecast
