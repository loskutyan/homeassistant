alarm:
  timer:
    hallway_door_left_opened:
      name: "Проверить, открыта ли дверь в прихожей, через "
      duration: 300

    hallway_door_time_to_close:
      name: "Надежно закрыть дверь через "
      duration: 20

  input_boolean:
    bathroom_valves:
      name: "Шаровые краны в ванной"

  template:
    - sensor:
        - name: "Найденные протечки"
          unique_id: found_water_leaks
          default_entity_id: sensor.found_water_leaks
          state: >
            {% set leakage_sensors = [
              'binary_sensor.bathroom_aqara_leak_sensor_water_leak',
              'binary_sensor.washing_machine_aqara_leak_sensor_water_leak',
              'binary_sensor.dishwasher_aqara_leak_sensor_water_leak',
            ] %}
            {{ states.binary_sensor
              | selectattr('entity_id','in', leakage_sensors)
              | selectattr('state', 'eq', 'on')
              | map(attribute='name')
              | join(', ')
              | lower }}

        - name: "Найденные задымления"
          unique_id: found_smokes
          default_entity_id: sensor.found_smokes
          state: >
            {% set smoke_sensors = [
              'binary_sensor.serverroom_smoke_sensor_smoke',
              'binary_sensor.kitchen_smoke_sensor_smoke',
            ] %}
            {{ states.binary_sensor
              | selectattr('entity_id','in', smoke_sensors)
              | selectattr('state', 'eq', 'on')
              | map(attribute='name')
              | join(', ')
              | lower }}

    - binary_sensor:
        - name: "Обнаружена протечка"
          unique_id: water_leak_detected
          default_entity_id: binary_sensor.water_leak_detected
          device_class: moisture
          state: >
            {% set found_water_leaks = states('sensor.found_water_leaks') %}
            {{ found_water_leaks != 'unknown' and found_water_leaks | length > 0 }}

        - name: "Обнаружено задымление"
          unique_id: smoke_detected
          default_entity_id: binary_sensor.smoke_detected
          device_class: smoke
          state: >
            {% set found_smokes = states('sensor.found_smokes') %}
            {{ found_smokes != 'unknown' and found_smokes | length > 0 }}

        - name: "Проблема с ИБП"
          unique_id: ups_not_fine
          default_entity_id: binary_sensor.ups_not_fine
          device_class: problem
          state: >
            {{ states('sensor.ups_status') not in ['Online', 'Online Battery Charging', 'On Battery Battery Discharging'] }}

        - name: "ИБП работает от аккумулятора"
          unique_id: ups_powered_by_battery
          default_entity_id: binary_sensor.ups_powered_by_battery
          state: >
            {{ states('sensor.ups_status') == 'On Battery Battery Discharging' }}
          icon: >
            {% if is_state('binary_sensor.ups_powered_by_battery', 'on') %}
              mdi:battery-arrow-down
            {% else %}
              mdi:battery-charging-100
            {% endif %}

        - name: "Перегрузка розетки кондиционера в спальне"
          unique_id: bedroom_ac_plug_overload
          default_entity_id: binary_sensor.bedroom_ac_plug_overload
          availability: >
            {% set status = states('switch.bedroom_ac_plug') %}
            {{ status == 'off'
               or (status == 'on' and states('sensor.bedroom_ac_plug_power') | float(-1) >= 0) }}
          state: >
            {{ states('sensor.bedroom_ac_plug_power') | float > 1000 }}
          icon: >
            {% if is_state('binary_sensor.bedroom_ac_plug_overload', 'on') %}
              mdi:lightning-bolt
            {% else %}
              mdi:power-plug
            {% endif %}

        - name: "Перегрузка розетки кондиционера в детской"
          unique_id: kidsroom_ac_plug_overload
          default_entity_id: binary_sensor.kidsroom_ac_plug_overload
          availability: >
            {% set status = states('switch.kidsroom_ac_plug') %}
            {{ status == 'off'
               or (status == 'on' and states('sensor.kidsroom_ac_plug_power') | float(-1) >= 0) }}
          state: >
            {{ states('sensor.kidsroom_ac_plug_power') | float > 1000 }}
          icon: >
            {% if is_state('binary_sensor.kidsroom_ac_plug_overload', 'on') %}
              mdi:lightning-bolt
            {% else %}
              mdi:power-plug
            {% endif %}

    - switch:
        - name: "Шаровые краны в ванной"
          unique_id: bathroom_valves
          default_entity_id: switch.bathroom_valves
          state: >
            {{ states('input_boolean.bathroom_valves') }}
          turn_on:
            action: script.open_bathroom_valves
          turn_off:
            action: script.close_bathroom_valves
          icon: >
            {% if is_state('input_boolean.bathroom_valves', 'on') %}
              mdi:valve-open
            {% else %}
              mdi:valve-closed
            {% endif %}

  alert:
    water_leak_detected:
      name: "Протечка воды"
      entity_id: binary_sensor.water_leak_detected
      state: "on"
      message: "🌊 Протечка воды: {{ states('sensor.found_water_leaks') }}"
      done_message: "🏜 Протечка воды устранена"
      repeat: 5
      can_acknowledge: true
      notifiers:
        - alerts_urgent

    smoke_detected:
      name: "Задымление"
      entity_id: binary_sensor.smoke_detected
      state: "on"
      message: "🔥 Задымление: {{ states('sensor.found_smokes') }}"
      done_message: "🧯 Задымление устранено"
      repeat: 5
      can_acknowledge: true
      notifiers:
        - alerts_urgent

    fridge_door_left_opened:
      name: "Дверь холодильника не закрыта"
      entity_id: binary_sensor.fridge_door
      state: "on"
      repeat: 5
      skip_first: true
      message: "❄ Дверь холодильника не закрыта!"
      notifiers:
        - alerts_urgent

    ups_power_went_down:
      name: "ИБП работает от аккумулятора"
      entity_id: binary_sensor.ups_powered_by_battery
      state: "on"
      repeat: 15
      message: "🔋 ИБП работает от аккумулятора! {{ states('sensor.time_date') }}"
      notifiers:
        - alerts_urgent

    ups_is_not_fine:
      name: "Проблема с ИБП"
      entity_id: binary_sensor.ups_not_fine
      state: "on"
      repeat: 60
      message: "⚠ Проблема с ИБП, статус {{ states('sensor.ups_status') }}. {{ states('sensor.time_date') }}"
      done_message: "🔋 Проблема с ИБП устранена, статус {{ states('sensor.ups_status') }}"
      notifiers:
        - alerts_urgent

    bedroom_ac_plug_overload:
      name: "Перегрузка розетки кондиционера в спальне"
      entity_id: binary_sensor.bedroom_ac_plug_overload
      state: "on"
      repeat: 5
      message: >-
        ⚠ Перегрузка розетки в спальне, потребление {{ states('sensor.bedroom_ac_plug_power') }}Вт, температура
        {{ states('sensor.bedroom_ac_plug_device_temperature') }}
      notifiers:
        - alerts_urgent

    kidsroom_ac_plug_overload:
      name: "Перегрузка розетки кондиционера в детской"
      entity_id: binary_sensor.kidsroom_ac_plug_overload
      state: "on"
      repeat: 5
      message: >-
        ⚠ Перегрузка розетки в детской, потребление {{ states('sensor.kidsroom_ac_plug_power') }}Вт, температура
        {{ states('sensor.kidsroom_ac_plug_device_temperature') }}
      notifiers:
        - alerts_urgent

  script:
    close_bathroom_valves:
      alias: "Закрытие кранов в ванной"
      sequence:
        - action: script.move_bathroom_valves
          data:
            direction: close
          response_variable: movement
        - condition: template
          value_template: "{{ movement is mapping and movement.completed }}"
        - action: notify.send_message
          continue_on_error: true
          target:
            entity_id: notify.tg_urgent
          data:
            message: "🚱 Краны перекрыты! {{ states('sensor.time_date') }}"

    open_bathroom_valves:
      alias: "Открытие кранов в ванной"
      sequence:
        - action: script.move_bathroom_valves
          data:
            direction: open
          response_variable: movement
        - condition: template
          value_template: "{{ movement is mapping and movement.completed }}"
        - action: notify.send_message
          continue_on_error: true
          target:
            entity_id: notify.tg_urgent
          data:
            message: "🚰 Краны открыты! {{ states('sensor.time_date') }}"

    move_bathroom_valves:
      alias: "Движение кранов в ванной"
      mode: queued
      max: 4
      sequence:
        - condition: template
          value_template: "{{ direction in ['open', 'close', 'recover'] }}"
        - variables:
            opening: "{{ direction == 'open' }}"
            open_relay: switch.bathroom_valves_relay_left
            close_relay: switch.bathroom_valves_relay_right
            leak_sensors: &bathroom_leak_sensors
              - binary_sensor.bathroom_aqara_leak_sensor_water_leak
              - binary_sensor.washing_machine_aqara_leak_sensor_water_leak
              - binary_sensor.dishwasher_aqara_leak_sensor_water_leak
            interrupted: false
        - variables:
            relay: "{{ open_relay if opening else close_relay }}"
        - if: "{{ not (is_state(open_relay, 'off') and is_state(close_relay, 'off')) }}"
          then:
            - action: switch.turn_off
              target:
                entity_id: "{{ [open_relay, close_relay] }}"
              continue_on_error: true
            - wait_template: "{{ is_state(open_relay, 'off') and is_state(close_relay, 'off') }}"
              timeout:
                seconds: 5
            - if: "{{ not wait.completed }}"
              then:
                - stop: "Движение кранов отменено: выключение обоих реле не подтверждено."
                  error: true
        - if: "{{ direction == 'recover' }}"
          then:
            - stop: "Оба реле кранов обесточены."
        # Проверяем датчики перед включением реле, уже внутри очереди.
        - if: >-
            {{ opening and (expand(leak_sensors) | selectattr('state', 'eq', 'off') | list | count
                            != leak_sensors | count) }}
          then:
            - stop: "Открытие кранов отменено: датчики не подтверждают отсутствие протечки."
        # После ошибки включения всё равно пытаемся обесточить реле.
        - action: switch.turn_on
          target:
            entity_id: "{{ relay }}"
          continue_on_error: true
        - variables:
            pulse_ends_at: "{{ now().timestamp() + (20 if opening else 30) }}"
        - wait_template: "{{ is_state(relay, 'on') }}"
          timeout:
            seconds: 5
        - variables:
            relay_started: "{{ wait.completed }}"
        - if: "{{ relay_started }}"
          then:
            - if: "{{ opening }}"
              then:
                # При протечке отпускаем реле открытия раньше, затем очередь выполнит закрытие.
                - wait_template: >-
                    {{ expand(leak_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}
                  timeout:
                    seconds: "{{ [0, pulse_ends_at - now().timestamp()] | max }}"
                - variables:
                    interrupted: "{{ wait.completed }}"
              else:
                - delay:
                    seconds: "{{ [0, pulse_ends_at - now().timestamp()] | max }}"
        - action: switch.turn_off
          target:
            entity_id: "{{ relay }}"
          continue_on_error: true
        - wait_template: "{{ is_state(open_relay, 'off') and is_state(close_relay, 'off') }}"
          timeout:
            seconds: 5
        - if: "{{ not relay_started or not wait.completed }}"
          then:
            - stop: "Не подтверждено включение или завершение импульса реле кранов."
              error: true
        - if: >-
            {{ interrupted or (opening and (expand(leak_sensors) | selectattr('state', 'eq', 'on') | list | count > 0)) }}
          then:
            - stop: "Открытие кранов прервано из-за протечки."
        - action: "input_boolean.turn_{{ 'on' if opening else 'off' }}"
          target:
            entity_id: input_boolean.bathroom_valves
        - variables:
            movement:
              completed: true
        - stop: "Движение кранов завершено."
          response_variable: movement

    hallway_door_is_opened_notify:
      alias: "Входная дверь открыта - уведомление"
      sequence:
        - action: notify.send_message
          target:
            entity_id: notify.tg_urgent
          data:
            message: >-
              {% set messages = [
                'входная дверь все еще открыта!',
                'не забыли закрыть входную дверь?',
                'CLOSE THE DOOR!!!11',
                'входную дверь может стоить закрыть?..'
              ] %}
              🚪 {{ states('sensor.time') }} - {{ messages | random }}

    hallway_door_lock_is_unlocked_notify:
      alias: "Замок входной двери не заперт - уведомление"
      sequence:
        - action: notify.send_message
          target:
            entity_id: notify.tg_urgent
          data:
            message: >-
              {% set messages = [
                'замок входной двери не закрыт!'
              ] %}
              🔓 {{ states('sensor.time') }} - {{ messages | random }}

  automation:
    - id: "Выключение реле кранов после прерванного движения"
      alias: bathroom_valves_relay_recovery
      initial_state: true
      triggers:
        - trigger: homeassistant
          event: start
        - trigger: state
          entity_id: script.move_bathroom_valves
          to: "off"
        - trigger: state
          entity_id:
            - switch.bathroom_valves_relay_left
            - switch.bathroom_valves_relay_right
          to: "on"
        - trigger: time_pattern
          minutes: "/1"
      conditions:
        - condition: state
          entity_id: script.move_bathroom_valves
          state: "off"
        - condition: template
          value_template: >-
            {{ is_state('switch.bathroom_valves_relay_left', 'on')
               or is_state('switch.bathroom_valves_relay_right', 'on') }}
      actions:
        # Тот же скрипт сериализует очистку и запрошенные движения.
        - action: script.move_bathroom_valves
          data:
            direction: recover

    - id: "Протечка воды"
      alias: water_leak_detected_alarm
      initial_state: true
      variables:
        leak_sensors: *bathroom_leak_sensors
      triggers:
        - trigger: state
          entity_id: *bathroom_leak_sensors
          to: "on"
          id: leak
        - trigger: homeassistant
          event: start
        - trigger: template
          value_template: >-
            {{ states('switch.bathroom_valves_relay_left') in ['on', 'off']
               and states('switch.bathroom_valves_relay_right') in ['on', 'off'] }}
      conditions:
        # При запуске и восстановлении связи состояние датчика уже может быть ON.
        - condition: template
          value_template: >-
            {{ trigger.id == 'leak' or expand(leak_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}
      actions:
        - action: script.close_bathroom_valves
          continue_on_error: true
        - action: alarm_control_panel.alarm_trigger
          target:
            entity_id: alarm_control_panel.miio_gateway

    - id: "ИБП снова работает от сети"
      alias: ups_power_is_up_again
      triggers:
        - trigger: state
          entity_id: binary_sensor.ups_powered_by_battery
          from: "on"
      conditions:
        - condition: state
          entity_id: binary_sensor.ups_not_fine
          state: "off"
      actions:
        - action: notify.send_message
          target:
            entity_id: notify.tg_urgent
          data:
            message: "🔌 ИБП снова работает от сети! {{ states('sensor.time_date') }}"

    - id: "Перегрузка розетки кондиционера в спальне"
      alias: bedroom_ac_plug_overload
      triggers:
        - trigger: state
          entity_id: binary_sensor.bedroom_ac_plug_overload
          to: "on"
      actions:
        - action: switch.turn_off
          target:
            entity_id: switch.bedroom_ac_plug
        - action: notify.send_message
          target:
            entity_id: notify.tg_urgent
          data:
            message: "🔌 Розетка в спальне выключена! {{ states('sensor.time_date') }}"

    - id: "Перегрузка розетки кондиционера в детской"
      alias: kidsroom_ac_plug_overload
      triggers:
        - trigger: state
          entity_id: binary_sensor.kidsroom_ac_plug_overload
          to: "on"
      actions:
        - action: switch.turn_off
          target:
            entity_id: switch.kidsroom_ac_plug
        - action: notify.send_message
          target:
            entity_id: notify.tg_urgent
          data:
            message: "🔌 Розетка в детской выключена! {{ states('sensor.time_date') }}"

    - id: "Дверь в прихожей открылась"
      alias: hallway_door_was_opened
      initial_state: true
      triggers:
        - trigger: state
          entity_id: binary_sensor.hallway_door_sensor_contact
          to: "on"
      conditions:
        - condition: state
          entity_id: timer.hallway_door_time_to_close
          state: "idle"
      actions:
        - action: notify.send_message
          continue_on_error: true
          target:
            entity_id: notify.tg_bot
          data:
            message: >-
              {% set messages = [
                'Входная дверь открыта в',
                'Распахнули входную дверь, а сейчас',
                'Кто-то открыл входную дверь в'
              ] %}
              🚪 {{ messages | random }} {{ states('sensor.time_date') }}
        - action: timer.start
          target:
            entity_id:
              - timer.hallway_door_left_opened
              - timer.hallway_door_time_to_close

    - id: "Проверка закрытия двери"
      alias: hallway_door_was_closed_check
      initial_state: true
      triggers:
        - trigger: state
          entity_id: timer.hallway_door_left_opened
          from: "active"
          to: "idle"
      conditions:
        - condition: state
          entity_id: binary_sensor.hallway_door_sensor_contact
          state: "on"
      actions:
        - action: script.hallway_door_is_opened_notify
          continue_on_error: true
        - action: timer.start
          target:
            entity_id: timer.hallway_door_left_opened
