cubeserver:
  template:
    - sensor:
        - name: "Cubeserver IP"
          unique_id: cubeserver_ip
          default_entity_id: sensor.cubeserver_ip
          state: !secret cubeserver_ip

        - name: "Windows 10 VM IP"
          unique_id: cubeserver_windows10_vm_ip
          default_entity_id: sensor.cubeserver_windows10_vm_ip
          state: !secret cubeserver_windows10_vm_ip

        - name: "Windows 10 VM name"
          unique_id: cubeserver_windows10_vm_name
          default_entity_id: sensor.cubeserver_windows10_vm_name
          state: "Windows 10"

        - name: "Cubeserver Llama Swap Port"
          unique_id: cubeserver_llama_swap_container_port
          default_entity_id: sensor.cubeserver_llama_swap_container_port
          state: !secret cubeserver_llama_swap_port

    - switch:
        - name: "VM Windows 10"
          unique_id: cubeserver_vm_windows10
          default_entity_id: switch.cubeserver_vm_windows10
          state: >
            {{ states('binary_sensor.cubeserver_vm_windows10_ping') }}
          turn_on:
            action: script.cubeserver_vm_windows10_run
          turn_off:
            action: script.cubeserver_vm_windows10_shutdown
          icon: mdi:microsoft-windows

        - name: "VM Ubuntu YaDisk"
          unique_id: cubeserver_vm_ubuntuyadisk
          default_entity_id: switch.cubeserver_vm_ubuntuyadisk
          state: >
            {{ states('binary_sensor.cubeserver_vm_ubuntuyadisk_ping') }}
          turn_on:
            action: shell_command.cubeserver_vm_ubuntuyadisk_run
          turn_off:
            action: shell_command.cubeserver_vm_ubuntuyadisk_shutdown
          icon: mdi:ubuntu

  # Диагностические статусы опрашиваются раз в сутки. Скрипты сверяют свежий ответ отдельно.
  command_line:
    - binary_sensor:
        unique_id: cubeserver_vm_windows10_virsh_status
        name: "Cubeserver VM Windows10 Virsh Status"
        command: >-
          ssh -i /config/ha.key -o StrictHostKeyChecking=no
          root@{{ states('sensor.cubeserver_ip') }}
          "env LC_ALL=C virsh domstate --domain '{{ states('sensor.cubeserver_windows10_vm_name') }}'"
        device_class: connectivity
        payload_on: "running"
        payload_off: "shut off"
        scan_interval: 86400

    - binary_sensor:
        unique_id: cubeserver_container_llama_swap_status
        name: "Cubeserver Container Llama Swap Status"
        command: >-
          ssh -i /config/ha.key -o StrictHostKeyChecking=no
          root@{{ states('sensor.cubeserver_ip') }}
          docker inspect --type container llama-swap
        value_template: >-
          {% set containers = value_json | default([]) %}
          {% set status = containers[0]['State']['Status'] if containers else none %}
          {% if status == 'running' %}
            running
          {% elif status in ['exited', 'created'] %}
            not running
          {% else %}
            {{ none }}
          {% endif %}
        device_class: connectivity
        payload_on: "running"
        payload_off: "not running"
        scan_interval: 86400

  shell_command:
    cubeserver_windows_vm_status: >-
      ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -i /config/ha.key
      root@{{ states('sensor.cubeserver_ip') }}
      "env LC_ALL=C virsh domstate --domain '{{ states('sensor.cubeserver_windows10_vm_name') }}'"
    cubeserver_llama_swap_status: >-
      ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -i /config/ha.key
      root@{{ states('sensor.cubeserver_ip') }}
      "docker inspect --type container --format '{% raw %}{{.State.Status}}{% endraw %}' llama-swap"
    cubeserver_vm_windows10_run: 'ssh -i /config/ha.key -o StrictHostKeyChecking=no root@{{ states(''sensor.cubeserver_ip'') }} ''virsh start "{{ states(''sensor.cubeserver_windows10_vm_name'') }}"'''
    cubeserver_vm_windows10_shutdown: 'ssh -i /config/ha.key -o StrictHostKeyChecking=no root@{{ states(''sensor.cubeserver_ip'') }} ''virsh shutdown "{{ states(''sensor.cubeserver_windows10_vm_name'') }}"'''
    cubeserver_vm_ubuntuyadisk_run: "ssh -i /config/ha.key -o StrictHostKeyChecking=no root@{{ states('sensor.cubeserver_ip') }} virsh start 'Ubuntu'"
    cubeserver_vm_ubuntuyadisk_shutdown: "ssh -i /config/ha.key -o StrictHostKeyChecking=no root@{{ states('sensor.cubeserver_ip') }} virsh shutdown 'Ubuntu'"
    cubeserver_vm_windows10_switch_to_internal_display: "ssh -i /config/ha.key -o StrictHostKeyChecking=no loskutyan@{{ states('sensor.cubeserver_windows10_vm_ip') }} 'psexec -s -i 1 -accepteula C:\\Windows\\System32\\DisplaySwitch.exe /internal'"
    cubeserver_vm_windows10_switch_to_external_display: "ssh -i /config/ha.key -o StrictHostKeyChecking=no loskutyan@{{ states('sensor.cubeserver_windows10_vm_ip') }} 'psexec -s -i 1 -accepteula C:\\Windows\\System32\\DisplaySwitch.exe /external'"
    cubeserver_docker_llama_swap_start: "ssh -i /config/ha.key -o StrictHostKeyChecking=no root@{{ states('sensor.cubeserver_ip') }} 'docker start llama-swap'"
    cubeserver_docker_llama_swap_stop: "ssh -i /config/ha.key -o StrictHostKeyChecking=no root@{{ states('sensor.cubeserver_ip') }} 'docker stop llama-swap'"

  script:
    # Один свежий запрос за вызов; ожидание с повторами задаёт вызывающий скрипт.
    cubeserver_check_status:
      alias: "cubeserver: разово проверить состояние VM или контейнера"
      mode: parallel
      sequence:
        - variables:
            status_response: null
        - action: "shell_command.cubeserver_{{ probe }}_status"
          response_variable: status_response
          continue_on_error: true
        - variables:
            result:
              confirmed: >-
                {{ status_response is mapping and status_response.returncode == 0
                   and status_response.stdout in expected_states }}
        - stop: "Проверка состояния завершена."
          response_variable: result

    cubeserver_vm_windows10_run:
      alias: "cubeserver: включение VM Windows 10"
      sequence:
        - action: script.cubeserver_vm_windows10_transition
          data:
            operation: start

    cubeserver_vm_windows10_shutdown:
      alias: "cubeserver: выключение VM Windows 10"
      sequence:
        - action: script.cubeserver_vm_windows10_transition
          data:
            operation: shutdown

    cubeserver_vm_windows10_transition:
      alias: "cubeserver: изменить состояние VM Windows 10"
      mode: queued
      max: 4
      sequence:
        - condition: template
          value_template: "{{ operation in ['start', 'shutdown'] }}"
        - variables:
            starting: "{{ operation == 'start' }}"
        - if: "{{ starting }}"
          then:
            - action: script.cubeserver_check_status
              data:
                probe: llama_swap
                expected_states: ["exited", "created"]
              response_variable: container
            - if: "{{ container is not mapping or not container.confirmed }}"
              then:
                - action: notify.send_message
                  continue_on_error: true
                  target:
                    entity_id: notify.tg_bot
                  data:
                    message: "🐳 Запуск VM Windows: останавливаем llama-swap..."
                - action: script.cubeserver_llama_swap_docker_stop
                  response_variable: container
            - if: "{{ container is not mapping or not container.confirmed }}"
              then:
                - action: notify.send_message
                  continue_on_error: true
                  target:
                    entity_id: notify.tg_bot
                  data:
                    message: "⚠ Запуск VM Windows отменён: остановка llama-swap не подтверждена."
                - stop: "Остановка llama-swap не подтверждена."
                  error: true
        - action: "shell_command.cubeserver_vm_windows10_{{ 'run' if starting else 'shutdown' }}"
          response_variable: command
          continue_on_error: true
        - if: "{{ command is not defined or command is not mapping or command.returncode != 0 }}"
          then:
            - action: notify.send_message
              continue_on_error: true
              target:
                entity_id: notify.tg_bot
              data:
                message: >-
                  ⚠ Команда {{ 'запуска' if starting else 'выключения' }} VM Windows завершилась ошибкой.
            - stop: "Команда изменения состояния VM Windows завершилась ошибкой."
              error: true
        - variables:
            vm:
              confirmed: false
        - if: "{{ starting }}"
          then:
            - wait_template: >-
                {{ is_state('binary_sensor.cubeserver_vm_windows10_ping', 'on') }}
              timeout:
                minutes: 2
            - if: "{{ not is_state('binary_sensor.cubeserver_vm_windows10_ping', 'on') }}"
              then:
                - action: notify.send_message
                  continue_on_error: true
                  target:
                    entity_id: notify.tg_bot
                  data:
                    message: "⚠ Windows не начала отвечать на ping после запуска VM."
                - stop: "Гостевая Windows не отвечает на ping."
                  error: true
            - action: script.cubeserver_check_status
              data:
                probe: windows_vm
                expected_states: ["running"]
              response_variable: vm
          else:
            # Потеря ping не означает остановку VM. Ждём свежего ответа virsh.
            # Бюджет опроса — 2 минуты; уже начатый shell_command может добавить
            # до 60 секунд (лимит HA). Число запросов тоже ограничено.
            - variables:
                shutdown_check_deadline: "{{ as_timestamp(now()) + 120 }}"
            - repeat:
                sequence:
                  - action: script.cubeserver_check_status
                    data:
                      probe: windows_vm
                      expected_states: ["shut off"]
                    response_variable: vm
                  - if: >-
                      {{ (vm is not mapping or not vm.confirmed) and repeat.index < 25
                         and as_timestamp(now()) < shutdown_check_deadline }}
                    then:
                      - delay:
                          seconds: >-
                            {{ [[shutdown_check_deadline - as_timestamp(now()), 0] | max, 5] | min }}
                until: >-
                  {{ (vm is mapping and vm.confirmed)
                     or as_timestamp(now()) >= shutdown_check_deadline or repeat.index >= 25 }}
        - if: "{{ vm is not mapping or not vm.confirmed }}"
          then:
            - action: notify.send_message
              continue_on_error: true
              target:
                entity_id: notify.tg_bot
              data:
                message: >-
                  ⚠ Не удалось подтвердить {{ 'запуск' if starting else 'выключение' }} VM Windows.
            - stop: "Состояние VM Windows не подтверждено."
              error: true
        - if: "{{ not starting }}"
          then:
            - action: notify.send_message
              continue_on_error: true
              target:
                entity_id: notify.tg_bot
              data:
                message: "🐳 Выключение VM Windows: запускаем llama-swap..."
            - action: script.cubeserver_llama_swap_docker_start

    cubeserver_llama_swap_docker_stop:
      alias: "cubeserver: остановка контейнера llama-swap"
      sequence:
        - action: shell_command.cubeserver_docker_llama_swap_stop
          continue_on_error: true
        # Даже если команда завершилась с ошибкой, состояние могло измениться.
        - action: script.cubeserver_check_status
          data:
            probe: llama_swap
            expected_states: ["exited", "created"]
          response_variable: container
        - if: "{{ container is not mapping or not container.confirmed }}"
          then:
            - action: notify.send_message
              continue_on_error: true
              target:
                entity_id: notify.tg_bot
              data:
                message: "⚠ Остановка llama-swap не подтверждена."
        - stop: "Проверка остановки llama-swap завершена."
          response_variable: container

    cubeserver_llama_swap_docker_start:
      alias: "cubeserver: запуск контейнера llama-swap"
      sequence:
        - action: shell_command.cubeserver_docker_llama_swap_start
          continue_on_error: true
        - action: script.cubeserver_check_status
          data:
            probe: llama_swap
            expected_states: ["running"]
          response_variable: container
        - if: "{{ container is not mapping or not container.confirmed }}"
          then:
            - action: notify.send_message
              continue_on_error: true
              target:
                entity_id: notify.tg_bot
              data:
                message: "⚠ Запуск llama-swap не подтверждён."
            - stop: "Запуск llama-swap не подтверждён."
              error: true

  automation:
    - id: "Началась загрузка торрента - уведомление"
      alias: torrent_downloading_started_notify
      mode: queued
      initial_state: true
      triggers:
        - trigger: event
          event_type: transmission_started_torrent
      actions:
        - action: notify.send_message
          target:
            entity_id: notify.tg_media
          data:
            message: "⬇ Cubeserver: Началась загрузка торрента. {{ trigger.event.data.name }}"

    - id: "Загрузка торрента завершена - уведомление"
      alias: torrent_downloading_completed_notify
      mode: queued
      initial_state: true
      triggers:
        - trigger: event
          event_type: transmission_downloaded_torrent
      actions:
        - action: notify.send_message
          target:
            entity_id: notify.tg_media
          data:
            message: "✅ Cubeserver: Завершена загрузка торрента. {{ trigger.event.data.name }}"

  # Заготовки для перехода на интеграцию Unraid. Сейчас отключены.
  # Источники InfluxDB/Telegraf и зависимые расчёты parity/температур удалены.
  # Перед переносом заменить старые entity_id на сущности новой интеграции
  # и проверить её состояния. unknown/unavailable не означают завершение проверки.
  # В старом шаблоне ниже fallback «Завершено» нужно пересмотреть при переносе:
  # отсутствие процесса ещё не подтверждает успешное завершение parity-check.
