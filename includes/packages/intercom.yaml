intercom:
  template:
    - triggers:
        - trigger: state
          from: "off"
          to: "on"
          entity_id: binary_sensor.smartintercom_vkhodiashchii_zvonok
      binary_sensor:
        - name: "Intercom Rings"
          state: "on"
          auto_off:
            seconds: 45

    - triggers:
        - trigger: state
          from: "Ответ"
          to: "Открытие двери"
          entity_id: sensor.smartintercom_sostoianie_linii
      binary_sensor:
        - name: "Intercom Lock Opened"
          state: "on"
          auto_off:
            seconds: 10
          device_class: lock

    - switch:
        - name: "Замок домофона"
          unique_id: intercom_lock
          default_entity_id: switch.intercom_lock
          state: >
            {% set auto_open = is_state('switch.smartintercom_otkryvat_na_sleduiushchii_zvonok', 'on') %}
            {% set not_door_is_being_opened = is_state('binary_sensor.intercom_lock_opened', 'off') %}
            {{ not auto_open and not_door_is_being_opened }}
          turn_on:
            action: script.intercom_lock_close
          turn_off:
            action: script.intercom_lock_open
          icon: mdi:phone-lock

    - lock:
        - name: "Intercom door"
          unique_id: intercom_door
          default_entity_id: lock.intercom_door
          optimistic: false
          state: "{{ is_state('switch.intercom_lock', 'on') }}"
          lock:
            action: switch.turn_on
            target:
              entity_id: switch.intercom_lock
          unlock:
            action: switch.turn_off
            target:
              entity_id: switch.intercom_lock

  script:
    intercom_rings_aqara_hub_quiet_sound_notify:
      alias: "Звонок в домофон - тихое звуковое уведомление (Aqara Hub)"
      sequence:
        - action: scene.create
          data:
            scene_id: aqara_hub_state_revert
            snapshot_entities: "media_player.miio_gateway"
        - action: media_player.volume_set
          target:
            entity_id: media_player.miio_gateway
          data:
            volume_level: 0.05
          continue_on_error: true
        - delay:
            seconds: 1
        - repeat:
            count: 2
            sequence:
              - action: media_player.play_media
                target:
                  entity_id: media_player.miio_gateway
                data:
                  media_content_type: "music"
                  media_content_id: 13
                continue_on_error: true
              - delay:
                  seconds: 5
        - action: scene.turn_on
          target:
            entity_id: scene.aqara_hub_state_revert

    intercom_lock_opened_aqara_hub_quiet_sound_notify:
      alias: "Открытия замка домофона - тихое звуковое уведомление (Aqara Hub)"
      sequence:
        - action: script.turn_off
          target:
            entity_id: script.intercom_rings_aqara_hub_quiet_sound_notify
        - action: scene.turn_on
          target:
            entity_id: scene.aqara_hub_state_revert
        - action: scene.create
          data:
            scene_id: aqara_hub_state_revert
            snapshot_entities: "media_player.miio_gateway"
        - action: media_player.volume_set
          target:
            entity_id: media_player.miio_gateway
          data:
            volume_level: 0.05
          continue_on_error: true
        - delay:
            seconds: 1
        - action: media_player.play_media
          target:
            entity_id: media_player.miio_gateway
          data:
            media_content_type: "music"
            media_content_id: 14
          continue_on_error: true
        - delay:
            seconds: 8
        - action: scene.turn_on
          target:
            entity_id: scene.aqara_hub_state_revert

    intercom_light_flashes_notify:
      alias: "Звонок в домофон - световое уведомление"
      sequence:
        - repeat:
            count: 3
            sequence:
              - repeat:
                  for_each:
                    - "orange"
                    - "green"
                    - "yellow"
                  sequence:
                    - parallel:
                        - action: light.turn_on
                          target:
                            entity_id:
                              - light.miio_gateway
                          data:
                            color_name: "{{ repeat.item }}"
                            brightness_pct: 100
                          continue_on_error: true
                        - action: light.turn_on
                          target:
                            entity_id:
                              - light.hallway_duty_aqara_led_strip
                          data:
                            color_name: "{{ repeat.item }}"
                            brightness_pct: 40
                          continue_on_error: true
                    - delay:
                        seconds: 2
              - action: light.turn_off
                target:
                  entity_id:
                    - light.miio_gateway
                    - light.hallway_duty_aqara_led_strip

    intercom_lock_open:
      alias: "Открыть замок домофона"
      sequence:
        - if:
            - condition: state
              entity_id: binary_sensor.intercom_rings
              state: "on"
          then:
            - action: button.press
              target:
                entity_id: button.smartintercom_propustit
          else:
            - action: switch.turn_on
              target:
                entity_id: switch.smartintercom_otkryvat_na_sleduiushchii_zvonok

    intercom_lock_close:
      alias: "Закрыть замок домофона"
      sequence:
        - if:
            - condition: state
              entity_id: binary_sensor.intercom_rings
              state: "on"
          then:
            - action: button.press
              target:
                entity_id: button.smartintercom_otkazat
        - action: switch.turn_off
          target:
            entity_id: switch.smartintercom_otkryvat_na_sleduiushchii_zvonok

  automation:
    - id: "Звонок в домофон - уведомление"
      alias: intercom_rings_notify
      triggers:
        - trigger: state
          entity_id: binary_sensor.intercom_rings
          from: "off"
          to: "on"
      actions:
        - action: notify.send_message
          target:
            entity_id: notify.tg_urgent
          data:
            message: >-
              {% set messages = [
                'Кто-то позвонил в домофон!',
                'Кажется, кто-то пришел и звонит в домофон.',
                'Внизу люди! Звонят в домофон.'
              ] %}
              🔔 {{ messages | random }} {{ states('sensor.time_date') }}
          continue_on_error: true
        - action: script.intercom_light_flashes_notify
        - if:
            - condition: state
              entity_id: switch.smartintercom_otkliuchit_trubku_domofona
              state: "on"
          then:
            action: script.intercom_rings_aqara_hub_quiet_sound_notify

    - id: "Замок домофона открыт - уведомление"
      alias: intercom_lock_was_opened_notify
      triggers:
        - trigger: state
          entity_id: binary_sensor.intercom_lock_opened
          from: "off"
          to: "on"
      actions:
        - action: notify.send_message
          target:
            entity_id: notify.tg_urgent
          data:
            message: >-
              {% set messages = [
                'Дверь домофона открыта!',
                'Замок внизу открыт!',
                'Люди впущены!'
              ] %}
              🔔 {{ messages | random }} {{ states('sensor.time_date') }}
          continue_on_error: true
        - if:
            - condition: state
              entity_id: switch.smartintercom_otkliuchit_trubku_domofona
              state: "on"
          then:
            action: script.intercom_lock_opened_aqara_hub_quiet_sound_notify
