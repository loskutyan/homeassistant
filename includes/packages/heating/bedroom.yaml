bedroom_heating:
  timer:
    bedroom_airpurifier_heater_remind:
      name: "Нагреватель бризера в спальне включен, напомнить через "
      duration: 7200
      restore: true

    bedroom_airpurifier_heater_turn_off:
      name: "Нагреватель бризера в спальне включен, выключение через "
      duration: 18000
      restore: true

    bedroom_airpurifier_heater_cooldown:
      name: "Нагреватель бризера в спальне остывает, можно включить через "
      duration: 1800
      restore: true

  template:
    - binary_sensor:
        - name: "Статус нагревателя бризера в спальне"
          unique_id: bedroom_airpurifier_ptc_status
          default_entity_id: binary_sensor.bedroom_airpurifier_ptc_status
          device_class: heat
          state: "{{ is_state_attr('fan.mijia_airpurifier_bedroom', 'ptc_status', True) }}"

        # Один стабильный OFF сохраняет начало пропуска при смене invalid-значений.
        - name: "Данные температуры спальни доступны"
          unique_id: bedroom_heating_temperature_available
          default_entity_id: binary_sensor.bedroom_heating_temperature_available
          state: "{{ is_number(states('sensor.bedroom_average_temperature')) }}"

    - switch:
        - name: "Нагреватель бризера в спальне"
          unique_id: bedroom_airpurifier_ptc
          default_entity_id: switch.bedroom_airpurifier_ptc
          availability: "{{ states('fan.mijia_airpurifier_bedroom') in ['on', 'off'] }}"
          state: "{{ state_attr('fan.mijia_airpurifier_bedroom', 'ptc') }}"
          turn_on:
            action: xiaomi_miio_airpurifier.fan_set_ptc_on
            target:
              entity_id: fan.mijia_airpurifier_bedroom
          turn_off:
            action: xiaomi_miio_airpurifier.fan_set_ptc_off
            target:
              entity_id: fan.mijia_airpurifier_bedroom
          icon: mdi:fire

  automation:
    - id: "Включение нагревателя бризера в спальне"
      alias: bedroom_airpurifier_heater_turn_on
      initial_state: true
      triggers:
        - trigger: time_pattern
          minutes: "/10"
        - trigger: state
          entity_id: switch.somebody_home
          from: "off"
          to: "on"
        - trigger: state
          entity_id: timer.bedroom_airpurifier_heater_cooldown
          to: "idle"
      conditions:
        - condition: state
          entity_id: switch.warm_season
          state: "off"
        - condition: state
          entity_id: switch.somebody_home
          state: "on"
        - condition: state
          entity_id: switch.bedroom_asleep
          state: "off"
        - condition: state
          entity_id: fan.mijia_airpurifier_bedroom
          state: "on"
          for:
            minutes: 1
        - condition: state
          entity_id: binary_sensor.bedroom_airpurifier_ptc_status
          state: "off"
          for:
            minutes: 1
        - condition: template
          value_template: >-
            {{ is_number(states('sensor.bedroom_average_temperature'))
               and is_number(states('input_number.target_temperature')) }}
        - condition: numeric_state
          entity_id: sensor.bedroom_average_temperature
          below: input_number.target_temperature
        - not:
            - condition: state
              entity_id: timer.bedroom_airpurifier_heater_cooldown
              state: "active"
      actions:
        - action: switch.turn_on
          target:
            entity_id: switch.bedroom_airpurifier_ptc

    - id: "Выключение нагревателя бризера в спальне"
      alias: bedroom_airpurifier_heater_turn_off
      initial_state: true
      triggers:
        - trigger: state
          entity_id: timer.bedroom_airpurifier_heater_turn_off
          from: "active"
          to: "idle"
        - trigger: numeric_state
          entity_id: sensor.bedroom_average_temperature
          value_template: "{{ state.state | float - 0.5 if is_number(state.state) else none }}"
          above: input_number.target_temperature
          for:
            minutes: 1
      conditions:
        - condition: state
          entity_id: switch.bedroom_airpurifier_ptc
          state: "on"
      actions:
        - action: switch.turn_off
          target:
            entity_id: switch.bedroom_airpurifier_ptc

    - id: "Восстановление ограничения нагрева бризера в спальне"
      alias: bedroom_airpurifier_heater_restore_limit
      initial_state: true
      triggers:
        - trigger: homeassistant
          event: start
        - trigger: time_pattern
          minutes: "/1"
        - trigger: state
          entity_id: switch.bedroom_airpurifier_ptc
          from:
            - "unknown"
            - "unavailable"
          to: "on"
        - trigger: state
          entity_id: binary_sensor.bedroom_heating_temperature_available
          to: "off"
          for:
            minutes: 2
      conditions:
        - condition: state
          entity_id: switch.bedroom_airpurifier_ptc
          state: "on"
        # Даём штатному обработчику включения две секунды на запуск таймера.
        - condition: template
          value_template: >-
            {% set render_time = now() -%}
            {% set heater_age = (render_time - states.switch.bedroom_airpurifier_ptc.last_changed).total_seconds() %}
            {% set validity = states['binary_sensor.bedroom_heating_temperature_available'] %}
            {% set missing_age = (render_time - validity.last_changed).total_seconds()
               if validity is not none and validity.state == 'off' else heater_age %}
            {% set temperature_missing = not is_number(states('sensor.bedroom_average_temperature')) %}
            {% set validity_missing = validity is none or validity.state in ['unknown', 'unavailable'] %}
            {{ (not is_state('timer.bedroom_airpurifier_heater_turn_off', 'active') and heater_age >= 2)
               or (temperature_missing and (is_state('binary_sensor.bedroom_heating_temperature_available', 'off')
                                           or validity_missing) and missing_age >= 120) }}
      actions:
        - action: switch.turn_off
          target:
            entity_id: switch.bedroom_airpurifier_ptc

    - id: "Включение нагревателя бризера в спальне - таймеры, уведомление"
      alias: bedroom_airpurifier_heater_turned_on_timers_notify
      initial_state: true
      triggers:
        - trigger: state
          entity_id: switch.bedroom_airpurifier_ptc
          from: "off"
          to: "on"
      actions:
        - action: timer.start
          target:
            entity_id:
              - timer.bedroom_airpurifier_heater_turn_off
              - timer.bedroom_airpurifier_heater_remind
        - action: timer.finish
          target:
            entity_id: timer.bedroom_airpurifier_heater_cooldown
        - action: notify.send_message
          target:
            entity_id: notify.tg_bot
          data:
            message: >-
              {% set messages = [
                'Нагреватель бризера в спальне включен!',
                'Бризер в спальне начинает греть воздух..',
                'Нагреватель бризера в спальне начал жарить!'
              ] %}
              🔥  {{ messages | random }} {{ states('sensor.time_date') }}
              🌡 Температура {{ states('sensor.bedroom_average_temperature') | round(1) }}°C

    - id: "Работает нагреватель бризера в спальне - уведомление"
      alias: bedroom_airpurifier_heater_on_reminder_notify
      initial_state: true
      triggers:
        - trigger: state
          entity_id: timer.bedroom_airpurifier_heater_remind
          from: "active"
          to: "idle"
        - trigger: homeassistant
          event: start
        - trigger: state
          entity_id: switch.bedroom_airpurifier_ptc
          from:
            - "unknown"
            - "unavailable"
          to: "on"
      conditions:
        - condition: state
          entity_id: switch.bedroom_airpurifier_ptc
          state: "on"
        - condition: state
          entity_id: timer.bedroom_airpurifier_heater_remind
          state: "idle"
        - condition: state
          entity_id: timer.bedroom_airpurifier_heater_turn_off
          state: "active"
      actions:
        - action: notify.send_message
          continue_on_error: true
          target:
            entity_id: notify.tg_bot
          data:
            message: >-
              {% set messages = [
                'Нагреватель бризера в спальне все еще работает!',
                'Бризер в спальне продолжает греть воздух..',
                'Нагреватель бризера в спальне еще жарит!'
              ] %}
              🔥 {{ messages | random }} {{ states('sensor.time_date') }}
        - action: timer.start
          target:
            entity_id: timer.bedroom_airpurifier_heater_remind

    - id: "Выключение нагревателя бризера в спальне - таймеры, уведомление"
      alias: bedroom_airpurifier_heater_turned_off_timers_notify
      initial_state: true
      triggers:
        - trigger: state
          entity_id: switch.bedroom_airpurifier_ptc
          from: "on"
          to: "off"
      actions:
        - action: timer.finish
          target:
            entity_id:
              - timer.bedroom_airpurifier_heater_remind
              - timer.bedroom_airpurifier_heater_turn_off
        - action: timer.start
          target:
            entity_id: timer.bedroom_airpurifier_heater_cooldown
        - action: notify.send_message
          target:
            entity_id: notify.tg_bot
          data:
            message: >-
              {% set messages = [
                'Нагреватель бризера в спальне выключен!',
                'Бризер в спальне завершает греть воздух..',
                'Нагреватель бризера в спальне покидает здание!'
              ] %}
              🧯 {{ messages | random }} {{ states('sensor.time_date') }}
              🌡 Температура {{ states('sensor.bedroom_average_temperature') | round(1) }}°C
