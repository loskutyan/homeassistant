doorbell:
  template:
    - triggers:
        - trigger: state
          from: 'off'
          to: 'on'
          entity_id: binary_sensor.elevator_hall_button_press_sensor_contact
      binary_sensor:
        - name: 'Doorbell Rings'
          state: 'on'
          auto_off:
            seconds: 15

  automation:
    - id: 'Звонок в дверь'
      alias: elevator_hall_doorbell_rings
      initial_state: true
      triggers:
        - trigger: state
          entity_id: binary_sensor.doorbell_rings
          from: 'off'
          to: 'on'
      actions:
        - if:
            - condition: time
              after: '09:00:00'
              before: '23:00:00'
          then:
            - action: media_player.play_media
              target:
                entity_id: media_player.miio_gateway
              data:
                media_content_type: 'music'
                media_content_id: 10
          continue_on_error: true
        - action: notify.send_message
          target:
            entity_id: notify.tg_urgent
          data:
            message: >-
              {% set messages = [
                'Кто-то позвонил в дверь!',
                'Кажется, кто-то пришел и звонит в дверь.',
                'Билим-билим!'
              ] %}
              🔔 {{ messages | random }} {{ states('sensor.time_date') }}
