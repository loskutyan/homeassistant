conditioning_bedroom:
  climate:
    - platform: smartir
      name: "Bedroom AC"
      unique_id: bedroom_ac
      device_code: 1132
      controller_data: remote.bedroom_broadlink_rm4mini_remote
      temperature_sensor: sensor.bedroom_average_temperature
      humidity_sensor: sensor.bedroom_average_humidity
      power_sensor: binary_sensor.bedroom_ac_power

  input_boolean:
    # Без initial: активная просушка восстанавливается после рестарта.
    bedroom_ac_self_dry_active:
      name: "Просушка кондиционера в спальне выполняется"

    bedroom_ac_power:
      name: "Кондиционер в спальне включен"
    bedroom_auto_conditioning:
      name: "Автоматическое охлаждение воздуха в спальне"

    bedroom_ac_swing_mode:
      name: "Режим качания жалюзи кондиционера в спальне"

  input_datetime:
    bedroom_ac_self_dry_finish_at:
      name: "Срок окончания просушки кондиционера в спальне"
      has_date: true
      has_time: true

  input_number:
    bedroom_ac_temperature:
      name: "Установленная температура кондиционера в спальне"
      min: 20
      max: 31
      step: 1
      icon: mdi:thermometer-low

    bedroom_target_cooling_temperature:
      name: "Целевая температура охлаждения в спальне"
      min: 20
      max: 31
      step: 0.5
      icon: mdi:thermometer-auto

    bedroom_ac_drying_upper_humidity_threshold:
      name: "Верхний порог влажности для осушения спальни"
      min: 0
      max: 100
      step: 1
      unit_of_measurement: "%"
      icon: mdi:water-percent

  input_select:
    bedroom_ac_mode:
      name: "Режим работы кондиционера в спальне"
      options:
        - auto
        - cool
        - fan_only
        - dry

    bedroom_ac_fan_mode:
      name: "Скорость обдува кондиционера в спальне"
      options:
        - auto
        - low
        - mid
        - high
      icon: mdi:fan

  template:
    - binary_sensor:
        - name: "Питание кондиционера в спальне"
          unique_id: bedroom_ac_power
          default_entity_id: binary_sensor.bedroom_ac_power
          device_class: power
          availability: >
            {% set status = states('switch.bedroom_ac_plug') %}
            {{ status == 'off'
               or (status == 'on' and states('sensor.bedroom_ac_plug_power') | float(-1) >= 0) }}
          state: >
            {% set power = states('sensor.bedroom_ac_plug_power') | float(0) %}
            {{ power > 1 }}

        - name: "Кондиционер в спальне охлаждает или сушит воздух"
          unique_id: bedroom_ac_is_cooling
          default_entity_id: binary_sensor.bedroom_ac_is_cooling
          availability: >
            {% set status = states('switch.bedroom_ac_plug') %}
            {{ status == 'off'
               or (status == 'on' and states('sensor.bedroom_ac_plug_power') | float(-1) >= 0) }}
          state: "{{ states('sensor.bedroom_ac_plug_power') | float > 100 }}"

    - switch:
        - name: "Выключатель кондиционера в спальне"
          unique_id: bedroom_ac_switch
          default_entity_id: switch.bedroom_ac
          state: >
            {% set ac_on = is_state('binary_sensor.bedroom_ac_power', 'on') %}
            {% set ac_plug_on = is_state('switch.bedroom_ac_plug', 'on') %}
            {{ ac_on and ac_plug_on }}
          turn_on:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.bedroom_ac_power
            - action: climate.set_temperature
              target:
                entity_id: climate.bedroom_ac
              data:
                temperature: "{{ states('input_number.bedroom_ac_temperature') | int }}"
                hvac_mode: "{{ states('input_select.bedroom_ac_mode') }}"
          turn_off:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.bedroom_ac_power
            - action: climate.turn_off
              target:
                entity_id: climate.bedroom_ac
          icon: mdi:air-conditioner

        - name: "Автоматическое охлаждение воздуха в спальне"
          unique_id: bedroom_auto_conditioning
          default_entity_id: switch.bedroom_auto_conditioning
          state: >
            {{ states('input_boolean.bedroom_auto_conditioning') }}
          turn_on:
            action: input_boolean.turn_on
            target:
              entity_id: input_boolean.bedroom_auto_conditioning
          turn_off:
            action: input_boolean.turn_off
            target:
              entity_id: input_boolean.bedroom_auto_conditioning
          icon: mdi:snowflake-thermometer

        - name: "Охлаждение воздуха в спальне"
          unique_id: bedroom_cooling
          default_entity_id: switch.bedroom_cooling
          state: >
            {% set operation = state_attr('climate.bedroom_ac', 'last_on_operation') -%}
            {% set ac_on = is_state('switch.bedroom_ac', 'on') %}
            {% set cooling_on = (operation == 'cool') %}
            {% set dry_on = (operation == 'dry') %}
            {% set auto_cooling_on = is_state('switch.bedroom_auto_conditioning', 'on') %}
            {% set is_cooling_temp_low = state_attr('climate.bedroom_ac', 'temperature') | int(31) <= 28 %}
            {{ ac_on and (dry_on or (cooling_on and (is_cooling_temp_low or auto_cooling_on))) }}
          turn_on:
            - action: climate.set_temperature
              target:
                entity_id: climate.bedroom_ac
              data:
                temperature: "{{ states('input_number.bedroom_target_cooling_temperature') | int(25) }}"
                hvac_mode: "cool"
            - action: switch.turn_on
              target:
                entity_id: switch.bedroom_auto_conditioning
          turn_off:
            action: climate.set_temperature
            target:
              entity_id: climate.bedroom_ac
            data:
              temperature: "{{ states('input_number.bedroom_ac_temperature') | int }}"
              hvac_mode: "fan_only"
          icon: mdi:snowflake

  script:
    bedroom_ac_self_dry:
      alias: "Просушка кондиционера в спальне"
      mode: single
      sequence:
        - condition: state
          entity_id: input_boolean.bedroom_ac_self_dry_active
          state: "off"
        # Срок сохраняем до аппаратных команд; повторный запуск его не продлевает.
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.bedroom_ac_self_dry_finish_at
          data:
            timestamp: "{{ now().timestamp() + 4 * 60 * 60 }}"
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.bedroom_ac_self_dry_active
        - action: switch.turn_off
          target:
            entity_id: switch.bedroom_auto_conditioning
        - action: climate.set_temperature
          target:
            entity_id: climate.bedroom_ac
          data:
            temperature: 31
            hvac_mode: "cool"
        - action: climate.set_fan_mode
          target:
            entity_id: climate.bedroom_ac
          data:
            fan_mode: "high"
        - action: notify.send_message
          continue_on_error: true
          target:
            entity_id: notify.tg_bot
          data:
            message: "💦 Запущено осушение кондиционера в спальне!"

    bedroom_ac_self_dry_finish:
      alias: "Завершение просушки кондиционера в спальне"
      mode: single
      sequence:
        - condition: state
          entity_id: input_boolean.bedroom_ac_self_dry_active
          state: "on"
        - condition: template
          value_template: >-
            {% set deadline = state_attr('input_datetime.bedroom_ac_self_dry_finish_at', 'timestamp') %}
            {{ not is_number(deadline) or deadline | float(0) <= now().timestamp() }}
        - condition: template
          value_template: >-
            {{ has_value('climate.bedroom_ac')
               and has_value('remote.bedroom_broadlink_rm4mini_remote')
               and has_value('input_boolean.bedroom_ac_power')
               and has_value('input_boolean.bedroom_auto_conditioning')
               and has_value('switch.bedroom_ac')
               and has_value('switch.bedroom_auto_conditioning') }}
        # Сначала выключаем AC, чтобы автоматическое охлаждение не успело вмешаться.
        - action: switch.turn_off
          target:
            entity_id: switch.bedroom_ac
        - action: climate.set_fan_mode
          target:
            entity_id: climate.bedroom_ac
          data:
            fan_mode: "auto"
        # SmartIR логирует ошибки ИК без исключения: проверяем фактическое питание.
        # При неизвестном/включённом питании маркер остаётся ON для следующей попытки.
        - condition: template
          value_template: >-
            {{ is_state('binary_sensor.bedroom_ac_power', 'off')
               or is_state('switch.bedroom_ac_plug', 'off') }}
        - action: switch.turn_on
          target:
            entity_id: switch.bedroom_auto_conditioning
        - condition: template
          value_template: >-
            {{ is_state('input_boolean.bedroom_ac_power', 'off')
               and is_state('input_boolean.bedroom_auto_conditioning', 'on')
               and has_value('climate.bedroom_ac')
               and is_state_attr('climate.bedroom_ac', 'fan_mode', 'auto') }}
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.bedroom_ac_self_dry_active
        - action: notify.send_message
          continue_on_error: true
          target:
            entity_id: notify.tg_bot
          data:
            message: "☀ Осушение кондиционера в спальне закончено!"

  automation:
    - id: "Восстановление и завершение просушки кондиционера в спальне"
      alias: bedroom_ac_self_dry_deadline
      initial_state: true
      triggers:
        - trigger: time
          at: input_datetime.bedroom_ac_self_dry_finish_at
        - trigger: homeassistant
          event: start
        - trigger: time_pattern
          minutes: "/1"
        - trigger: state
          entity_id:
            - climate.bedroom_ac
            - remote.bedroom_broadlink_rm4mini_remote
            - binary_sensor.bedroom_ac_power
            - switch.bedroom_ac_plug
          from:
            - "unknown"
            - "unavailable"
        - trigger: state
          entity_id: binary_sensor.bedroom_ac_power
          to: "off"
      conditions:
        - condition: state
          entity_id: input_boolean.bedroom_ac_self_dry_active
          state: "on"
      actions:
        # Проверки актуального срока находятся в скрипте, а не в снимке триггера.
        - action: script.bedroom_ac_self_dry_finish

    - id: "Выбор режима работы кондиционера в спальне"
      alias: select_bedroom_ac_mode
      triggers:
        - trigger: state
          entity_id:
            - input_select.bedroom_ac_mode
      conditions:
        - condition: state
          entity_id: switch.bedroom_ac
          state: "on"
      actions:
        - action: climate.set_temperature
          target:
            entity_id: climate.bedroom_ac
          data:
            temperature: "{{ states('input_number.bedroom_ac_temperature') | int }}"
            hvac_mode: "{{ states('input_select.bedroom_ac_mode') }}"

    - id: "Выбор температуры для кондиционера в спальне"
      alias: select_bedroom_ac_temperature
      triggers:
        - trigger: state
          entity_id:
            - input_number.bedroom_ac_temperature
      conditions:
        - condition: state
          entity_id: switch.bedroom_ac
          state: "on"
        - condition: state
          entity_id: climate.bedroom_ac
          attribute: last_on_operation
          state: "cool"
      actions:
        - action: climate.set_temperature
          target:
            entity_id: climate.bedroom_ac
          data:
            temperature: "{{ states('input_number.bedroom_ac_temperature') | int }}"
            hvac_mode: "{{ states('input_select.bedroom_ac_mode') }}"

    - id: "Выбор скорости обдува кондиционера в спальне"
      alias: select_bedroom_ac_fan_mode
      triggers:
        - trigger: state
          entity_id: input_select.bedroom_ac_fan_mode
      actions:
        - action: climate.set_fan_mode
          target:
            entity_id: climate.bedroom_ac
          data:
            fan_mode: "{{ trigger.to_state.state }}"

    - id: "Выбор режима качания халюзи кондиционера в спальне"
      alias: select_bedroom_ac_swing_mode
      triggers:
        - trigger: state
          entity_id: input_boolean.bedroom_ac_swing_mode
      actions:
        - action: climate.set_swing_mode
          target:
            entity_id: climate.bedroom_ac
          data:
            swing_mode: "{{ trigger.to_state.state }}"

    - id: "Отслеживание режима работы кондиционера в спальне"
      alias: tracking_bedroom_ac_mode
      triggers:
        - trigger: state
          entity_id: climate.bedroom_ac
          attribute: last_on_operation
      conditions:
        - condition: template
          value_template: "{{ trigger.to_state.state is defined and trigger.to_state.state not in ['unknown', 'unavailable'] }}"
      actions:
        - action: input_select.select_option
          target:
            entity_id: input_select.bedroom_ac_mode
          data:
            option: "{{ trigger.to_state.state }}"

    - id: "Отслеживание температуры кондиционера в спальне"
      alias: tracking_bedroom_ac_temperature
      triggers:
        - trigger: state
          entity_id: climate.bedroom_ac
          attribute: temperature
      conditions:
        - condition: template
          value_template: "{{ trigger.to_state.attributes.temperature | int(0) > 0 }}"
      actions:
        - action: input_number.set_value
          target:
            entity_id: input_number.bedroom_ac_temperature
          data:
            value: "{{ trigger.to_state.attributes.temperature | int }}"

    - id: "Отслеживание скорости обдува кондиционера в спальне"
      alias: tracking_bedroom_ac_fan_mode
      triggers:
        - trigger: state
          entity_id: climate.bedroom_ac
          attribute: fan_mode
      conditions:
        - condition: template
          value_template: "{{ trigger.to_state.attributes.fan_mode is defined and trigger.to_state.attributes.fan_mode not in ['unknown', 'unavailable'] }}"
      actions:
        - action: input_select.select_option
          target:
            entity_id: input_select.bedroom_ac_fan_mode
          data:
            option: "{{ trigger.to_state.attributes.fan_mode }}"

    - id: "Отслеживание режима качания халюзи кондиционера в спальне"
      alias: tracking_bedroom_ac_swing_mode
      triggers:
        - trigger: state
          entity_id: climate.bedroom_ac
          attribute: swing_mode
      conditions:
        - condition: template
          value_template: "{{ trigger.to_state.attributes.swing_mode is defined and trigger.to_state.attributes.swing_mode not in ['unknown', 'unavailable'] }}"
      actions:
        - action: input_boolean.turn_{{ trigger.to_state.attributes.swing_mode }}
          target:
            entity_id: input_boolean.bedroom_ac_swing_mode

    - id: "Умный контроль кондиционера для охлаждения спальни"
      alias: bedroom_ac_cooling_smart_control
      initial_state: true
      triggers:
        - trigger: time_pattern
          minutes: "/15"
        - trigger: state
          entity_id: input_number.bedroom_target_cooling_temperature
        - trigger: state
          entity_id:
            - switch.bedroom_ac
            - switch.bedroom_auto_conditioning
          to: "on"
        - trigger: state
          entity_id: climate.bedroom_ac
          attribute: last_on_operation
      conditions:
        - condition: state
          entity_id: input_select.bedroom_ac_mode
          state: "cool"
        - condition: state
          entity_id:
            - switch.bedroom_ac
            - switch.bedroom_auto_conditioning
          state: "on"
        - condition: template
          value_template: >-
            {{ has_value('climate.bedroom_ac')
               and is_number(states('sensor.bedroom_average_temperature'))
               and is_number(states('input_number.bedroom_target_cooling_temperature'))
               and is_number(state_attr('climate.bedroom_ac', 'temperature')) }}
        - condition: template
          value_template: >
            {% set target_temp = states('input_number.bedroom_target_cooling_temperature') | float %}
            {% set cur_temp = states('sensor.bedroom_average_temperature') | float %}
            {% set ac_temp = state_attr('climate.bedroom_ac', 'temperature') | float %}
            {% set delta = target_temp - cur_temp %}
            {{ (delta > 0.5 and ac_temp < 31) or (delta < -0.5 and  ac_temp > cur_temp) }}
      actions:
        - action: climate.set_temperature
          target:
            entity_id: climate.bedroom_ac
          data:
            temperature: >
              {% set target_temp = states('input_number.bedroom_target_cooling_temperature') | float %}
              {% set cur_temp = states('sensor.bedroom_average_temperature') | float %}
              {% set delta = target_temp - cur_temp %}
              {% if delta > 0.5 %}
                31
              {% elif delta < -0.5 %}
                {{ target_temp | int }}
              {% endif %}
            hvac_mode: "cool"

    - id: "Умный контроль кондиционера для осушения спальни"
      alias: bedroom_ac_drying_smart_control
      initial_state: true
      triggers:
        - trigger: time_pattern
          minutes: "/15"
        - trigger: state
          entity_id:
            - switch.bedroom_ac
            - switch.bedroom_auto_conditioning
          to: "on"
        - trigger: state
          entity_id: input_number.bedroom_ac_drying_upper_humidity_threshold
        - trigger: numeric_state
          entity_id: sensor.bedroom_average_humidity
          above: input_number.bedroom_ac_drying_upper_humidity_threshold
          for:
            minutes: 1
        - trigger: numeric_state
          entity_id: sensor.bedroom_average_humidity
          below: 40
          for:
            minutes: 1
      conditions:
        - condition: template
          value_template: >-
            {{ has_value('climate.bedroom_ac')
               and is_number(states('sensor.bedroom_average_humidity'))
               and is_number(states('input_number.bedroom_ac_drying_upper_humidity_threshold')) }}
        - or:
            - condition: state
              entity_id: input_select.bedroom_ac_mode
              state: "cool"
            - condition: state
              entity_id: input_select.bedroom_ac_mode
              state: "dry"
        - condition: state
          entity_id:
            - switch.bedroom_ac
            - switch.bedroom_auto_conditioning
          state: "on"
      actions:
        - if:
            - condition: state
              entity_id: input_select.bedroom_ac_mode
              state: "cool"
            - condition: numeric_state
              entity_id: sensor.bedroom_average_humidity
              above: input_number.bedroom_ac_drying_upper_humidity_threshold
          then:
            - action: input_select.select_option
              target:
                entity_id: input_select.bedroom_ac_mode
              data:
                option: "dry"
            - action: notify.send_message
              target:
                entity_id: notify.tg_bot
              data:
                message: |-
                  ☀ Кондиционер в спальне переключен в режим осушения.
                  🌡 Температура {{ states('sensor.bedroom_average_temperature') | round(1) }}°C
                  💧 Влажность {{ states('sensor.bedroom_average_humidity') | round(1) }}%
        - if:
            - condition: state
              entity_id: input_select.bedroom_ac_mode
              state: "dry"
            - condition: numeric_state
              entity_id: sensor.bedroom_average_humidity
              below: 40
          then:
            - action: input_select.select_option
              target:
                entity_id: input_select.bedroom_ac_mode
              data:
                option: "cool"
            - action: notify.send_message
              target:
                entity_id: notify.tg_bot
              data:
                message: |-
                  ❄ Кондиционер в спальне переключен в режим охлаждения.
                  🌡 Температура {{ states('sensor.bedroom_average_temperature') | round(1) }}°C
                  💧 Влажность {{ states('sensor.bedroom_average_humidity') | round(1) }}%

    - id: "Изменение режима качания халюзи кондиционера в спальне при работе с монитором"
      alias: toggle_bedroom_ac_swing_mode_on_cubeserver_vm_windows10_monitor_using
      triggers:
        - trigger: state
          entity_id: switch.cubeserver_vm_windows10_with_bedroom_monitor_using
          from:
            - "on"
            - "off"
          to:
            - "on"
            - "off"
      conditions:
        - condition: state
          entity_id: input_select.bedroom_ac_mode
          state: "cool"
        - condition: state
          entity_id:
            - switch.bedroom_ac
            - switch.bedroom_auto_conditioning
          state: "on"
        - condition: template
          value_template: >
            {{ trigger.to_state.state == states('input_boolean.bedroom_ac_swing_mode') }}
      actions:
        - action: climate.set_swing_mode
          target:
            entity_id: climate.bedroom_ac
          data:
            swing_mode: "{{ trigger.from_state.state }}"
